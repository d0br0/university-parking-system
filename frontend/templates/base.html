<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Парковка Университета{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/toast.css">
    <link rel="stylesheet" href="/static/css/history.css">
    <!-- CDN для HTMX 2.x -->
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous" defer></script>
    <!-- CDN для Alpine.js 3.x -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <!-- Основной JS приложения - загружаем с defer в head, чтобы store определился вовремя -->
    <script src="/static/js/app.js" defer></script>
    <!-- Иконки Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🅿️</text></svg>">
    <style>
        [x-cloak] { display: none !important; }
        .nav-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .profile-link {
            display: flex !important;
            align-items: center;
        }
    </style>
</head>
<body class="bg-bg text-text" x-data="{
        menuOpen: false,
        user: null,
        userLoaded: false,
        init() {
            // Загружаем данные пользователя из API
            fetch('/api/auth/me', { credentials: 'include' })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    this.user = data;
                    this.userLoaded = true;
                    // Принудительно обновляем статус активной сессии
                    if (this.user && typeof Alpine !== 'undefined') {
                        const store = Alpine.store('activeSession');
                        if (store && typeof store.load === 'function') {
                            store.load();
                        }
                    }
                })
                .catch(() => {
                    this.user = null;
                    this.userLoaded = true;
                });
        },
        isSessionPage() {
            return window.location.pathname.startsWith('/session/');
        },
        isAuthPage() {
            return window.location.pathname === '/' || window.location.pathname === '/register';
        }
    }">
    <nav class="navbar" x-show="userLoaded && !isAuthPage()" x-cloak>
        <div class="container">
            <div class="nav-content">
                <a href="/" class="logo">
                    <span class="material-icons">local_parking</span>
                    <span>Университетская парковка</span>
                </a>
                <button class="menu-toggle" @click="menuOpen = !menuOpen" aria-label="Меню">
                    <span class="material-icons">menu</span>
                </button>
                <div class="nav-links" :class="{ 'open': menuOpen }">
                    <a href="/profile" class="nav-link profile-link">
                        <template x-if="user?.avatar_url">
                            <img :src="user.avatar_url" alt="Avatar" class="nav-avatar">
                        </template>
                        <template x-if="!user?.avatar_url">
                            <span class="material-icons">account_circle</span>
                        </template>
                        <span>Профиль</span>
                    </a>
                    <a href="/dashboard" class="nav-link">
                        <span class="material-icons">dashboard</span>
                        Панель
                    </a>
                    <a href="/history" class="nav-link">
                        <span class="material-icons">history</span>
                        История
                    </a>
                    <a href="/api/admin/page" class="nav-link" x-show="user?.is_admin">
                        <span class="material-icons">qr_code_2</span>
                        QR-коды
                    </a>
                    <form method="POST" action="/auth/logout" class="inline">
                        <button type="submit" class="nav-link logout-btn">
                            <span class="material-icons">logout</span>
                            Выйти
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Университетская система платной парковки. Все права защищены.</p>
            <p class="footer-links">
                <a href="/docs" target="_blank">API Документация</a> |
                <a href="/health" target="_blank">Статус системы</a>
            </p>
        </div>
    </footer>

    <script src="/static/js/toast.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
