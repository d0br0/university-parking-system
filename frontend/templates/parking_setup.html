{% extends "base.html" %}

{% block title %}Настройка парковки — Парковка Университета{% endblock %}

{% block content %}
<div class="container py-8" x-data="parkingSetup()">
    <div class="max-w-2xl mx-auto">
        <div class="dashboard-header mb-6">
            <h1 class="page-title flex items-center gap-3">
                <span class="material-icons text-primary">settings_suggest</span>
                Настройка новой парковки
            </h1>
            <p class="text-muted">Выберите параметры для начала парковочной сессии</p>
        </div>

        <div class="dashboard-card shadow-lg">
            <div class="card-body p-8">
                <form @submit.prevent="startParking" class="space-y-6">
                    <!-- Выбор автомобиля -->
                    <div class="form-group">
                        <label class="form-label font-bold mb-2 block text-lg">
                            <span class="material-icons align-middle mr-1">directions_car</span>
                            Ваш автомобиль
                        </label>
                        <template x-if="vehicles.length > 0">
                            <select x-model="selectedVehicle" class="form-input py-3 text-lg w-full" required>
                                <option value="" disabled>Выберите автомобиль...</option>
                                <template x-for="v in vehicles" :key="v.id">
                                    <option :value="v.id" x-text="`${v.license_plate} — ${v.model || 'Без модели'}`"></option>
                                </template>
                            </select>
                        </template>
                        <template x-if="vehicles.length === 0">
                            <div class="alert alert-warning">
                                <p>У вас нет добавленных автомобилей. Пожалуйста, <a href="/profile" class="underline">добавьте авто в профиле</a>.</p>
                            </div>
                        </template>
                    </div>

                    <!-- Выбор зоны -->
                    <div class="form-group">
                        <label class="form-label font-bold mb-2 block text-lg">
                            <span class="material-icons align-middle mr-1">location_on</span>
                            Парковочная зона
                        </label>
                        <select x-model="selectedZone" class="form-input py-3 text-lg w-full" required>
                            <option value="" disabled>Выберите зону...</option>
                            <template x-for="z in zones" :key="z.id">
                                <option :value="z.id" x-text="z.name"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Тариф (инфо) -->
                    <template x-if="selectedZone">
                        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 mt-4">
                            <div class="flex items-center gap-2 text-blue-700">
                                <span class="material-icons">info</span>
                                <strong>Информация о тарифе:</strong>
                            </div>
                            <p class="mt-1 text-blue-600">Стоимость: 150 ₽/час. Первые 15 минут бесплатно.</p>
                        </div>
                    </template>

                    <div class="pt-6 border-t border-gray-100">
                        <button type="submit" 
                                class="btn btn-primary w-full py-4 text-xl font-bold flex items-center justify-center gap-3 shadow-md hover:scale-[1.02] transition-transform"
                                :disabled="loading || !selectedVehicle || !selectedZone">
                            <span x-show="!loading" class="material-icons">play_circle_filled</span>
                            <span x-show="loading" class="spinner"></span>
                            <span x-text="loading ? 'Запуск...' : 'Начать парковку'"></span>
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-gray-50 flex justify-center py-4">
                <a href="/dashboard" class="text-muted hover:text-primary flex items-center gap-1 transition-colors">
                    <span class="material-icons text-sm">arrow_back</span>
                    Вернуться назад
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
    .max-w-2xl { max-width: 42rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .space-y-6 > * + * { margin-top: 1.5rem; }
    .p-8 { padding: 2rem; }
    .text-xl { font-size: 1.25rem; }
</style>
{% endblock %}

{% block scripts %}
<script>
    function parkingSetup() {
        return {
            vehicles: [],
            zones: [],
            selectedVehicle: '',
            selectedZone: '',
            loading: false,

            async init() {
                try {
                    // Загружаем авто
                    const vRes = await fetch('/api/vehicles/', { credentials: 'include' });
                    if (vRes.ok) this.vehicles = await vRes.json();
                    if (this.vehicles.length > 0) this.selectedVehicle = this.vehicles[0].id;

                    // Загружаем зоны
                    const zRes = await fetch('/api/zones/', { credentials: 'include' });
                    if (zRes.ok) this.zones = await zRes.json();
                    if (this.zones.length > 0) this.selectedZone = this.zones[0].id;
                } catch (e) {
                    console.error('Ошибка инициализации:', e);
                }
            },

            async startParking() {
                if (this.loading) return;
                this.loading = true;
                try {
                    const response = await fetch('/api/sessions/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            vehicle_id: this.selectedVehicle,
                            zone_id: this.selectedZone
                        }),
                        credentials: 'include'
                    });

                    if (response.ok) {
                        const data = await response.json();
                        window.location.href = `/session/${data.id}`;
                    } else {
                        const err = await response.json();
                        Toast.error(err.detail || 'Не удалось начать парковку');
                    }
                } catch (e) {
                    console.error('Ошибка:', e);
                    Toast.error('Ошибка соединения с сервером');
                } finally {
                    this.loading = false;
                }
            }
        }
    }
</script>
{% endblock %}
